plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dbfleetops'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

sourceSets {
    failureTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    failureTestImplementation.extendsFrom testImplementation
    failureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    failureTestImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    failureTestImplementation 'org.testcontainers:testcontainers:2.0.5'
    failureTestImplementation 'org.testcontainers:testcontainers-mysql:2.0.5'
    failureTestImplementation 'org.testcontainers:testcontainers-toxiproxy:2.0.5'
    failureTestImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
}

tasks.named('test') {
    systemProperty 'db-fleetops.credential.encryption-key',
            'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests that require external infrastructure.'
    group = 'verification'

    testClassesDirs = testing.suites.test.sources.output.classesDirs
    classpath = testing.suites.test.sources.runtimeClasspath
    systemProperty 'db-fleetops.credential.encryption-key',
            'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='

    useJUnitPlatform {
        includeTags 'integration'
    }

    shouldRunAfter tasks.named('test')

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.register('agentFailureTest', Test) {
    description = 'Reproduces known Control Plane-Agent failure scenarios.'
    group = 'verification'

    dependsOn tasks.named('bootJar')
    testClassesDirs = sourceSets.failureTest.output.classesDirs
    classpath = sourceSets.failureTest.runtimeClasspath
    useJUnitPlatform {
        includeTags 'agent-failure'
    }
    shouldRunAfter tasks.named('test'), tasks.named('integrationTest')

    systemProperty 'failureTest.requireDocker',
            System.getenv('FAILURE_TEST_REQUIRE_DOCKER') ?: 'false'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}

tasks.register('architectureTest', Test) {
    description = 'Measures whether the Control Plane-Agent split provides its claimed benefits.'
    group = 'verification'

    dependsOn tasks.named('bootJar')
    testClassesDirs = sourceSets.failureTest.output.classesDirs
    classpath = sourceSets.failureTest.runtimeClasspath
    useJUnitPlatform {
        includeTags 'architecture-check'
    }

    systemProperty 'failureTest.requireDocker',
            System.getenv('FAILURE_TEST_REQUIRE_DOCKER') ?: 'false'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }
}
